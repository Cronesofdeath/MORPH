[versions]
agp = "9.4.0"
kotlin = "2.3.21"
material = "1.5.0"
icons = "1.7.8"
activity = "1.10.1"
navigation = "2.8.9"
lifecycle = "2.8.7"
work = "2.10.1"
room = "2.7.2"
ksp = "2.3.4"
hilt = "2.59.2"
datastore = "1.1.7"
coil = "3.3.0"
ffmpeg = "8.1.9"
smart = "0.2.1"
poi = "5.5.1"
pdf = "2.0.27.0"
svg = "1.4"
exif = "1.4.1"
commonmark = "0.24.0"
jsoup = "1.21.1"
compress = "1.28.0"
xz = "1.10"
zip = "2.11.5"
jackson = "2.19.2"
aalto = "1.3.3"
junit = "4.13.2"

[plugins]
android-app = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[libraries]
material = { module = "androidx.compose.material3:material3", version.ref = "material" }
icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "icons" }
icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "icons" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
work = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
hilt-runtime = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }
ffmpeg = { module = "dev.ffmpegkit-maintained:ffmpeg-kit-full-gpl", version.ref = "ffmpeg" }
smart = { module = "com.arthenica:smart-exception-java", version.ref = "smart" }
poi-core = { module = "org.apache.poi:poi", version.ref = "poi" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
poi-scratch = { module = "org.apache.poi:poi-scratchpad", version.ref = "poi" }
pdf = { module = "com.tom-roush:pdfbox-android", version.ref = "pdf" }
svg = { module = "com.caverock:androidsvg-aar", version.ref = "svg" }
exif = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }
commonmark-core = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
compress = { module = "org.apache.commons:commons-compress", version.ref = "compress" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
zip = { module = "net.lingala.zip4j:zip4j", version.ref = "zip" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version.ref = "jackson" }
jackson-csv = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-csv", version.ref = "jackson" }
jackson-properties = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-properties", version.ref = "jackson" }
aalto = { module = "com.fasterxml:aalto-xml", version.ref = "aalto" }
stax = { module = "javax.xml.stream:stax-api", version = "1.0-2" }
junit = { module = "junit:junit", version.ref = "junit" }
