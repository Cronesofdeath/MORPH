name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: JVM tests and debug lint
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug --max-workers=2
      - name: Compact ARM64 release check
        run: bash gradlew :app:assembleRelease -PcompactArm64=true -PallowDevSign=true --max-workers=2
      - name: Verify offline release packaging
        shell: pwsh
        run: ./tools/Test-ReleasePackage.ps1 -Archive app/build/compact-arm64/outputs/apk/release/app-release.apk
